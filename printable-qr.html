<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RayBee OS - Official Girlfriend Pass</title>
  <style>
    :root {
      --gold: #f5b041;
      --pink: #ff6b81;
      --paper: #fff9f7;
      --night: #1a1218;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #120b11; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 20px; }
    .card { width: min(450px, 100%); background: linear-gradient(135deg, #2b1828, #3b2234); border: 2px solid var(--gold); border-radius: 24px; padding: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .logo { font-size: 60px; margin-bottom: 10px; }
    h1 { color: var(--gold); font-size: 28px; margin-bottom: 6px; }
    p { color: var(--pink); font-size: 16px; margin-bottom: 20px; }
    .pass-code { background: rgba(0,0,0,0.3); border: 1px dashed var(--gold); padding: 14px; border-radius: 12px; font-family: monospace; font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 20px; }
    .qr-placeholder { width: 140px; height: 140px; background: #fff; border-radius: 16px; margin: 0 auto 20px; display: grid; place-items: center; color: #333; font-weight: bold; }
    .footer { font-size: 12px; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐝💖</div>
    <h1>RayBee OS</h1>
    <p>Official Girlfriend Access Pass</p>
    <div class="pass-code">PASSCODE: 1204</div>
    <div class="qr-placeholder">QR CODE</div>
    <div class="footer">Issued with endless love by Ray for Bee • Forever & Always</div>
  </div>
</body>
</html>
