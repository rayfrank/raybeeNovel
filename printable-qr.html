<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QwarraOS Printable QR</title>
  <style>
    :root {
      --ink: #21131a;
      --plum: #5b273f;
      --pink: #d9447b;
      --rose: #f4a6be;
      --mint: #81d8c4;
      --paper: #fffdfd;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #e9e5e7;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      margin: 12mm auto;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 8mm 24mm rgba(43, 20, 31, 0.18);
    }

    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    .sheet::before {
      top: 0;
      right: 0;
      width: 58mm;
      height: 100%;
      background: var(--plum);
      clip-path: polygon(68% 0, 100% 0, 100% 100%, 18% 100%, 52% 63%, 34% 31%);
    }

    .sheet::after {
      right: 18mm;
      bottom: 20mm;
      width: 25mm;
      height: 25mm;
      border: 1.2mm solid var(--rose);
      transform: rotate(12deg);
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 297mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24mm 25mm 18mm;
      text-align: center;
    }

    .edition {
      display: flex;
      align-items: center;
      gap: 3mm;
      margin: 0 0 4mm;
      color: #267567;
      font-size: 9pt;
      font-weight: 800;
      text-transform: uppercase;
    }

    .edition::before {
      content: "";
      width: 10mm;
      height: 0.7mm;
      background: var(--pink);
    }

    h1 {
      margin: 0;
      font: 700 43pt/0.95 Georgia, "Times New Roman", serif;
      letter-spacing: 0;
    }

    h1 span { color: var(--pink); }

    .message {
      max-width: 132mm;
      margin: 7mm 0 10mm;
      color: #5c4852;
      font: 16pt/1.35 Georgia, "Times New Roman", serif;
    }

    .qr-frame {
      width: 116mm;
      height: 116mm;
      display: grid;
      place-items: center;
      padding: 7mm;
      border: 1.2mm solid var(--ink);
      background: #fff;
      box-shadow: 4mm 4mm 0 var(--rose);
    }

    .qr-frame img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scan {
      margin: 12mm 0 2.5mm;
      color: var(--pink);
      font-size: 12pt;
      font-weight: 900;
      text-transform: uppercase;
    }

    .url {
      margin: 0;
      color: var(--ink);
      font-size: 10pt;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .footer {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      align-items: center;
      gap: 8mm;
      margin-top: auto;
      padding-top: 12mm;
      border-top: 0.4mm solid #d7cbd1;
      font-size: 8pt;
      font-weight: 800;
      text-transform: uppercase;
    }

    .footer span:first-child { text-align: left; }
    .footer span:last-child {
      color: #267567;
      text-align: right;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body { background: #fff; }
      .sheet {
        width: 210mm;
        height: 297mm;
        min-height: 297mm;
        margin: 0;
        box-shadow: none;
      }
    }

    @media screen and (max-width: 820px) {
      .sheet {
        width: 100%;
        min-height: 100vh;
        margin: 0;
      }

      .content {
        min-height: 100vh;
        padding-right: 8vw;
        padding-left: 8vw;
      }

      .qr-frame {
        width: min(116mm, 72vw);
        height: min(116mm, 72vw);
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <section class="content">
      <p class="edition">Sibling edition · Connected since 2004</p>
      <h1>Qwarra<span>OS</span></h1>
      <p class="message">In another alternative universe, I would still choose you.</p>

      <div class="qr-frame">
        <img src="qr/qwarra-os-qr.svg" alt="QR code opening QwarraOS">
      </div>

      <p class="scan">Scan to enter QwarraOS</p>
      <p class="url">rayfrank.github.io/QWAARRAA_OS/</p>

      <footer class="footer">
        <span>QWARAAA ↔ RWAAAY</span>
        <span>One for all, all for one. Always.</span>
      </footer>
    </section>
  </main>
</body>
</html>
